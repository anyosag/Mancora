name: Release

# Releasing is automatic: merge a change to VERSION into main and this
# workflow builds, smoke-tests and publishes Mancora <VERSION> with its
# installers. It publishes only when v<VERSION> hasn't been released yet, so
# re-runs and other merges never duplicate a release.
#
# Pull requests that touch the apps or packaging build the installers too,
# as run artifacts, without releasing anything. A pushed v* tag (matching
# VERSION) or a manual run on main also releases.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:  # ignored for tag pushes
      - "VERSION"
      - "docs/releases/**"
      - "Tools/package/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "Apps/**"
      - "Sources/**"
      - "Tools/package/**"
      - "Resources/**"
      - "VERSION"
      - "docs/releases/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run on main or a tag midway through publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number is the commit count
      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          swift --version
      - name: Build, sign ad hoc and package
        run: Tools/package/macos/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2025
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2.4-release
          tag: 6.2.4-RELEASE
      - name: Build, stage, test and package
        shell: pwsh
        run: Tools/package/windows/package.ps1 -Output dist -TestInstall
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux CLI
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: Tools/package/linux/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [macos, windows, linux]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this version needs a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION ($version)."
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Mancora $version is already released; bump VERSION to publish a new release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        if: steps.version.outputs.publish == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            if [ -f "docs/releases/$version.md" ]; then cat "docs/releases/$version.md"; echo; fi
            sed "s/@VERSION@/$version/g" Tools/package/RELEASE_NOTES.md
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mancora ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          # 0.x versions are previews.
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          files: dist/*
          fail_on_unmatched_files: true
